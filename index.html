<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>微信twu · Bug汇报站</title>

  <meta name="description" content="微信twu 的 Bug 汇报站：填表即可把问题提交到 GitHub Issues，也能查看、搜索、筛选已有报告。">
  <meta name="theme-color" content="#07c160">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">

  <!-- 分享到微信 / 聊天软件时的预览信息 -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="微信twu">
  <meta property="og:title" content="微信twu · Bug汇报站">
  <meta property="og:description" content="发现 Bug？在这里填写表单就能提交到 GitHub Issues，也能查看其他玩家反馈的问题。">
  <meta property="og:url" content="https://jiadan209.github.io/wechat-twu-bugs/">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="微信twu · Bug汇报站">
  <meta name="twitter:description" content="发现 Bug？在这里填写表单就能提交到 GitHub Issues，也能查看其他玩家反馈的问题。">

  <link rel="stylesheet" href="styles.css">
  <style>
    /* 1. 列表顶部提示条：分页截断 / 限流兜底 */
    .truncate-note {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
      font-size: 13px;
      line-height: 1.6;
      color: var(--text-muted);
      background: var(--bg-soft);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px;
      margin-bottom: 10px;
    }
    .truncate-note .err-link {
      color: var(--green-text);
      font-weight: 700;
      text-decoration: underline;
    }
    .truncate-note.stale-note {
      color: #b45309;
      background: rgba(245, 158, 11, 0.12);
      border-color: rgba(245, 158, 11, 0.35);
    }
    .stale-retry {
      margin-left: auto;
      padding: 2px 9px;
      border-radius: 8px;
      border: 1px solid rgba(245, 158, 11, 0.55);
      background: transparent;
      color: inherit;
      font-family: inherit;
      font-size: 0.72rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.16s ease;
    }
    .stale-retry:hover,
    .stale-retry:focus-visible {
      background: rgba(245, 158, 11, 0.18);
    }

    /* 2. 邮箱公开提示 */
    .field-hint {
      margin: 6px 0 0;
      font-size: 12px;
      line-height: 1.5;
      color: #b45309;
    }

    /* 3. 严重程度：色块单选，替代下拉 */
    .severity-group {
      border: 0;
      margin: 0 0 1.05rem;
      padding: 0;
      min-width: 0;
    }
    .severity-group legend {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      font-size: 0.8rem;
      color: var(--text-sub);
      margin-bottom: 7px;
      padding: 0;
      letter-spacing: 0.01em;
    }
    .severity-options {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    .severity-options .sev-option {
      --sev: #94a3b8;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin: 0;
      padding: 10px 8px;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-sub);
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: border-color 0.18s ease, color 0.18s ease, box-shadow 0.18s ease;
    }
    .severity-options .sev-option[data-sev="一般"] { --sev: #f59e0b; }
    .severity-options .sev-option[data-sev="严重"] { --sev: #f97316; }
    .severity-options .sev-option[data-sev="致命"] { --sev: #ef4444; }
    .severity-options .sev-option input {
      position: absolute;
      opacity: 0;
      width: 1px;
      height: 1px;
      margin: 0;
    }
    .severity-options .sev-option .sev-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--sev);
      flex-shrink: 0;
    }
    .severity-options .sev-option:has(input:checked) {
      color: var(--sev);
      border-color: var(--sev);
      box-shadow: inset 0 0 0 1px var(--sev);
      background: var(--bg-card);
    }
    .severity-options .sev-option:has(input:focus-visible) {
      outline: 2px solid var(--green);
      outline-offset: 2px;
    }
    @media (max-width: 620px) {
      .severity-options { grid-template-columns: repeat(2, 1fr); }
    }

    /* 4. 快捷筛选芯片（替代状态下拉） */
    .quick-chips {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 0.75rem;
    }
    .quick-chips .chip {
      padding: 5px 12px;
      font-family: inherit;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-sub);
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      cursor: pointer;
      transition: color 0.18s ease, border-color 0.18s ease, background 0.18s ease;
    }
    .quick-chips .chip:hover {
      color: var(--text-main);
      border-color: var(--border-strong);
    }
    .quick-chips .chip.active {
      color: var(--green-text);
      background: var(--green-soft);
      border-color: rgba(7, 193, 96, 0.35);
    }
    .quick-chips .chip[data-chip="urgent"].active {
      color: #b45309;
      background: rgba(245, 158, 11, 0.12);
      border-color: rgba(245, 158, 11, 0.4);
    }

    /* 5. 列表：严重程度色条 + 标签 + 标题两行截断 */
    .issue-item.sev-致命::before { background: #ef4444; }
    .issue-item.sev-严重::before { background: #f97316; }
    .issue-item.sev-一般::before { background: #f59e0b; }
    .issue-item.sev-轻微::before { background: #94a3b8; }

    .issue-item .sev-tag {
      font-size: 0.66rem;
      font-weight: 700;
      padding: 1px 6px;
      border-radius: 8px;
      color: #fff;
      flex-shrink: 0;
    }
    .issue-item .sev-tag.sev-致命 { background: #ef4444; }
    .issue-item .sev-tag.sev-严重 { background: #f97316; }
    .issue-item .sev-tag.sev-一般 { background: #f59e0b; }
    .issue-item .sev-tag.sev-轻微 { background: #94a3b8; }

    .issue-title {
      white-space: normal;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    @media (prefers-color-scheme: dark) {
      .truncate-note { color: #9ca3af; background: #1f2430; }
      .truncate-note.stale-note { color: #fcd34d; background: rgba(245, 158, 11, 0.14); }
      .field-hint { color: #fbbf24; }
    }
  </style>
</head>
