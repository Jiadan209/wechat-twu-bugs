<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>微信twu · Bug汇报站</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="bug-report-card">
    <div class="card-header">
      <div class="app-title">
        <h1>微信twu</h1>
        <span class="badge">BUG 汇报</span>
      </div>
      <div class="subhead">
        <span class="twu-icon">TurboWarp 作品</span>
        <span class="sep" aria-hidden="true">·</span>
        <span>GitHub Issues 提交</span>
      </div>
    </div>

    <div class="card-body">
      <div class="draft-notice" id="draftNotice" role="region" aria-label="草稿恢复提示">
        <span>📝 检测到您上次填写的草稿，是否恢复？</span>
        <div class="draft-actions">
          <button type="button" id="restoreDraftBtn">恢复</button>
          <button type="button" id="discardDraftBtn">丢弃</button>
        </div>
      </div>

      <div class="main-grid">
        <!-- 左栏 -->
        <div class="left-column">
          <div class="col-title">
            <span class="icon" aria-hidden="true">✏️</span>
            <span>提交新的 Bug 报告</span>
          </div>

          <div class="intro-text">
            <strong>发现微信twu的 Bug 了？</strong> 感谢你的反馈！<br>
            填写下方表单提交，或查看右侧已有报告。
          </div>

          <form id="bugReportForm" novalidate>
            <div class="row-2col">
              <div class="form-group">
                <label for="nickname">
                  <span class="square-dot" aria-hidden="true"></span>你的昵称
                  <span class="required" aria-hidden="true">*</span>
                </label>
                <input type="text" class="form-control" id="nickname"
                       placeholder="" maxlength="30"
                       autocomplete="nickname" aria-required="true">
              </div>
              <div class="form-group">
                <label for="email">
                  <span class="square-dot" aria-hidden="true"></span>联系邮箱
                </label>
                <input type="email" class="form-control" id="email"
                       placeholder="方便回复你" maxlength="80"
                       inputmode="email" autocomplete="email">
              </div>
            </div>

            <div class="form-group">
              <label for="bugTitle">
                <span class="square-dot" aria-hidden="true"></span>Bug 简要描述
                <span class="required" aria-hidden="true">*</span>
              </label>
              <input type="text" class="form-control" id="bugTitle"
                     placeholder="例如：发送消息后别人没接收到"
                     maxlength="80" aria-required="true"
                     aria-describedby="titleCounter">
              <div class="char-counter" id="titleCounter">0 / 80</div>
              <div class="duplicate-hint" id="duplicateHint" aria-live="polite"></div>
            </div>

            <div class="row-2col">
              <div class="form-group">
                <label for="bugType">
                  <span class="square-dot" aria-hidden="true"></span>问题类型
                </label>
                <select class="form-control" id="bugType">
                  <option value="界面显示" selected>界面显示</option>
                  <option value="功能异常">功能异常</option>
                  <option value="闪退卡死">闪退/卡死</option>
                  <option value="性能问题">性能问题</option>
                  <option value="其他">其他</option>
                </select>
              </div>
              <div class="form-group">
                <label for="severity">
                  <span class="square-dot" aria-hidden="true"></span>严重程度
                </label>
                <select class="form-control" id="severity">
                  <option value="轻微">轻微 — 不影响使用</option>
                  <option value="一般" selected>一般 — 有点烦人</option>
                  <option value="严重">严重 — 无法正常聊天</option>
                  <option value="致命">致命 — 完全崩溃</option>
                </select>
              </div>
            </div>

            <div class="form-group">
              <label for="bugDescription">
                <span class="square-dot" aria-hidden="true"></span>详细描述
                <span class="required" aria-hidden="true">*</span>
              </label>
              <textarea class="form-control textarea-tall" id="bugDescription"
                        placeholder="请描述：什么时候发生的？你点击了什么？期望结果是什么？"
                        maxlength="1000" aria-required="true"></textarea>
              <div class="char-counter" id="descCounter">0 / 1000</div>
            </div>

            <div class="form-group">
              <label for="steps">
                <span class="square-dot" aria-hidden="true"></span>复现步骤 (建议填写)
              </label>
              <textarea class="form-control" id="steps"
                        placeholder="1. 打开微信twu聊天界面&#10;2. 点击输入框输入文字&#10;3. 快速点击发送三次"
                        maxlength="600"></textarea>
              <div class="char-counter" id="stepsCounter">0 / 600</div>
            </div>

            <div class="action-buttons">
              <button type="button" class="btn" id="clearBtn">清空</button>
              <button type="submit" class="btn btn-primary" id="submitBtn">
                <span aria-hidden="true">🚀</span> 提交到 GitHub
              </button>
            </div>
          </form>

          <div id="messageContainer" role="status" aria-live="polite"></div>
        </div>

        <!-- 右栏 -->
        <div class="right-column">
          <div class="col-title">
            <span class="icon blue" aria-hidden="true">📋</span>
            <span>已有 Bug 报告</span>
          </div>

          <div class="stats-panel" id="statsPanel">
            <div class="stat-card">
              <div class="stat-value" id="statTotal">—</div>
              <div class="stat-label">总数</div>
            </div>
            <div class="stat-card">
              <div class="stat-value" id="statOpen">—</div>
              <div class="stat-label">未解决</div>
            </div>
            <div class="stat-card closed">
              <div class="stat-value" id="statClosed">—</div>
              <div class="stat-label">已解决</div>
            </div>
            <div class="stat-card week">
              <div class="stat-value" id="statWeek">—</div>
              <div class="stat-label">最近7天</div>
            </div>
          </div>

          <div class="issues-section">
            <div class="issues-header">
              <h2>
                <span>全部报告</span>
                <span class="count-badge" id="issueCount">—</span>
              </h2>
              <button class="refresh-btn" id="refreshBtn" type="button" aria-label="刷新 Bug 列表">
                <span aria-hidden="true">🔄</span> 刷新
              </button>
            </div>

            <div class="filter-bar">
              <input type="text" id="searchInput" placeholder="🔍 搜索关键词"
                     aria-label="搜索 Bug 报告" autocomplete="off">
              <select id="stateFilter" aria-label="按状态筛选">
                <option value="all">全部状态</option>
                <option value="open">未解决</option>
                <option value="closed">已解决</option>
              </select>
              <select id="sortFilter" aria-label="排序方式">
                <option value="created">最新创建</option>
                <option value="comments">最多评论</option>
                <option value="updated">最近更新</option>
              </select>
            </div>

            <div id="issuesContainer" class="issues-container">
              <div class="issues-loading">⏳ 正在加载…</div>
            </div>
          </div>
        </div>
      </div>

      <div class="footnote">
        ⚡ 微信twu · 由 TurboWarp 驱动 · 提交后将打开 GitHub Issues 页面
      </div>
    </div>
  </div>

  <!-- 弹窗 -->
  <div class="modal-overlay" id="issueModal">
    <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-header">
        <h3 id="modalTitle">加载中…</h3>
        <button class="modal-close" id="modalCloseBtn" type="button" aria-label="关闭弹窗">✕</button>
      </div>
      <div class="modal-body">
        <div class="modal-meta" id="modalMeta"></div>
        <div class="modal-body-content" id="modalBody"></div>
        <div class="modal-comments" id="modalComments"></div>
      </div>
      <div class="modal-footer">
        <button class="btn" type="button" id="modalFooterCloseBtn">关闭</button>
        <a class="btn btn-primary" id="modalGithubLink" href="#" target="_blank" rel="noopener noreferrer">去 GitHub 查看 →</a>
      </div>
    </div>
  </div>

  <script>
  (function () {
    'use strict';

    /* ==================== 配置 ==================== */
    const GITHUB_CONFIG = {
      owner: 'Jiadan209',
      repo: 'wechat-twu-bugs',
      labels: ['bug', '微信twu']
    };

    const DRAFT_KEY = 'wechat_twu_bug_draft';
    const SUBMIT_LIMIT_KEY = 'wechat_twu_last_submit';
    const SUBMIT_COOLDOWN_MS = 3 * 60 * 1000;

    const ISSUES_CACHE_KEY = 'wechat_twu_issues_cache';
    const ISSUES_ETAG_KEY = 'wechat_twu_issues_etag';
    const COMMENTS_CACHE_PREFIX = 'wechat_twu_comments_';
    const CACHE_TTL = 5 * 60 * 1000;

    const $ = (sel, root) => (root || document).querySelector(sel);

    /* ==================== 状态 ==================== */
    let allIssues = [];
    let lastFocusedElement = null;
    let currentModalNumber = null;
    let rateLimitTimer = null;
    let refreshLabelTimer = null;

    /* ==================== 工具 ==================== */
    function debounce(fn, wait) {
      let timer = null;
      return function () {
        const ctx = this;
        const args = arguments;
        clearTimeout(timer);
        timer = setTimeout(function () { fn.apply(ctx, args); }, wait);
      };
    }

    function escapeHtml(unsafe) {
      if (unsafe === null || unsafe === undefined) return '';
      return String(unsafe)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function readSession(key) {
      try {
        const raw = sessionStorage.getItem(key);
        return raw ? JSON.parse(raw) : null;
      } catch (e) { return null; }
    }

    function writeSession(key, value) {
      try { sessionStorage.setItem(key, JSON.stringify(value)); } catch (e) {}
    }

    function readLocal(key) {
      try {
        const raw = localStorage.getItem(key);
        return raw ? JSON.parse(raw) : null;
      } catch (e) { return null; }
    }

    /* ==================== 轻量 Markdown 渲染 ==================== */
    function mdInline(text) {
      return text
        .replace(/`([^`]+)`/g, '<code class="md-code">$1</code>')
        .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
        .replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>')
        .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,
          '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
    }

    function renderMarkdown(src) {
      const escaped = escapeHtml(src || '');
      const lines = escaped.split('\n');
      const out = [];
      let inFence = false;
      let fenceBuf = [];
      let listType = null;
      let listBuf = [];

      function flushList() {
        if (listType) {
          out.push('<' + listType + '>' + listBuf.join('') + '</' + listType + '>');
          listType = null;
          listBuf = [];
        }
      }

      for (let i = 0; i < lines.length; i++) {
        const line = lines[i];

        if (/^\s*```/.test(line)) {
          if (inFence) {
            out.push('<pre class="md-pre"><code>' + fenceBuf.join('\n') + '</code></pre>');
            fenceBuf = [];
            inFence = false;
          } else {
            flushList();
            inFence = true;
          }
          continue;
        }

        if (inFence) { fenceBuf.push(line); continue; }

        const h = line.match(/^(#{1,6})\s+(.*)$/);
        if (h) {
          flushList();
          const level = h[1].length;
          out.push('<h' + level + '>' + mdInline(h[2]) + '</h' + level + '>');
          continue;
        }

        const ul = line.match(/^\s*[-*+]\s+(.*)$/);
        if (ul) {
          if (listType !== 'ul') { flushList(); listType = 'ul'; }
          listBuf.push('<li>' + mdInline(ul[1]) + '</li>');
          continue;
        }

        const ol = line.match(/^\s*\d+[.)]\s+(.*)$/);
        if (ol) {
          if (listType !== 'ol') { flushList(); listType = 'ol'; }
          listBuf.push('<li>' + mdInline(ol[1]) + '</li>');
          continue;
        }

        flushList();

        if (/^\s*(---+|\*\*\*+|___+)\s*$/.test(line)) { out.push('<hr>'); continue; }
        if (!line.trim()) { continue; }

        out.push('<p>' + mdInline(line) + '</p>');
      }

      flushList();
      if (inFence && fenceBuf.length) {
        out.push('<pre class="md-pre"><code>' + fenceBuf.join('\n') + '</code></pre>');
      }
      return out.join('\n');
    }

    /* ==================== 草稿 ==================== */
    function getFormData() {
      return {
        nickname: $('#nickname').value,
        email: $('#email').value,
        bugTitle: $('#bugTitle').value,
        bugType: $('#bugType').value,
        severity: $('#severity').value,
        bugDescription: $('#bugDescription').value,
        steps: $('#steps').value
      };
    }

    function hasDraftContent(data) {
      return !!(data && (data.nickname || data.email || data.bugTitle || data.bugDescription || data.steps));
    }

    function saveDraft() {
      const data = getFormData();
      if (hasDraftContent(data)) {
        try { localStorage.setItem(DRAFT_KEY, JSON.stringify(data)); } catch (e) {}
      }
    }

    function loadDraftFromStorage() {
      return readLocal(DRAFT_KEY);
    }

    function restoreDraft() {
      const data = loadDraftFromStorage();
      if (!data) return;
      $('#nickname').value = data.nickname || '';
      $('#email').value = data.email || '';
      $('#bugTitle').value = data.bugTitle || '';
      $('#bugType').value = data.bugType || '界面显示';
      $('#severity').value = data.severity || '一般';
      $('#bugDescription').value = data.bugDescription || '';
      $('#steps').value = data.steps || '';
      updateAllCounters();
      checkDuplicate();
      $('#draftNotice').classList.remove('active');
    }

    function discardDraft() {
      try { localStorage.removeItem(DRAFT_KEY); } catch (e) {}
      $('#draftNotice').classList.remove('active');
    }

    /* ==================== 字数统计 ==================== */
    function updateCounter(inputId, counterId, max) {
      const el = document.getElementById(inputId);
      const counter = document.getElementById(counterId);
      if (!el || !counter) return;
      const len = el.value.length;
      counter.textContent = len + ' / ' + max;
      counter.classList.remove('warn', 'over');
      if (len >= max) counter.classList.add('over');
      else if (len >= max * 0.9) counter.classList.add('warn');
    }

    function updateAllCounters() {
      updateCounter('bugTitle', 'titleCounter', 80);
      updateCounter('bugDescription', 'descCounter', 1000);
      updateCounter('steps', 'stepsCounter', 600);
    }

    /* ==================== 内联错误提示 ==================== */
    function showFieldError(el, message) {
      clearFieldError(el);
      const errId = el.id + 'Error';
      const p = document.createElement('p');
      p.className = 'field-error';
      p.id = errId;
      p.textContent = message;
      el.classList.add('invalid');
      el.setAttribute('aria-invalid', 'true');
      el.setAttribute('aria-describedby', errId);
      el.insertAdjacentElement('afterend', p);
    }

    function clearFieldError(el) {
      if (!el || !el.id) return;
      el.classList.remove('invalid');
      el.removeAttribute('aria-invalid');
      if (el.id === 'bugTitle') {
        el.setAttribute('aria-describedby', 'titleCounter');
      } else {
        el.removeAttribute('aria-describedby');
      }
      const err = document.getElementById(el.id + 'Error');
      if (err) err.remove();
    }

    function validateForm() {
      const rules = [
        { id: 'nickname', test: function (v) { return v.trim().length > 0; }, msg: '请填写你的昵称' },
        { id: 'email', test: function (v) { return !v.trim() || /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.trim()); }, msg: '邮箱格式不正确，请检查' },
        { id: 'bugTitle', test: function (v) { return v.trim().length >= 4; }, msg: 'Bug 简要描述至少需要 4 个字' },
        { id: 'bugDescription', test: function (v) { return v.trim().length >= 10; }, msg: '详细描述至少需要 10 个字' }
      ];

      for (let i = 0; i < rules.length; i++) {
        const rule = rules[i];
        const el = document.getElementById(rule.id);
        if (!el) continue;
        if (!rule.test(el.value)) {
          showFieldError(el, rule.msg);
          el.focus();
          return { ok: false, field: el, message: rule.msg };
        }
        clearFieldError(el);
      }
      return { ok: true };
    }

    /* ==================== API 层 ==================== */
    function isConfigValid() {
      return GITHUB_CONFIG.owner.trim() !== '' && GITHUB_CONFIG.repo.trim() !== '';
    }

    function classifyError(res) {
      const remaining = res.headers.get('x-ratelimit-remaining');
      if (res.status === 403 && remaining === '0') {
        const resetTs = Number(res.headers.get('x-ratelimit-reset') || 0) * 1000;
        const minutes = resetTs > Date.now()
          ? Math.max(1, Math.ceil((resetTs - Date.now()) / 60000))
          : 60;
        return { type: 'rate-limit', minutes: minutes };
      }
      if (res.status === 404) return { type: 'not-found' };
      return { type: 'http', status: res.status };
    }

    function cacheRemainMs() {
      const cached = readSession(ISSUES_CACHE_KEY);
      if (!cached || !cached.ts) return 0;
      return Math.max(0, CACHE_TTL - (Date.now() - cached.ts));
    }

    async function fetchIssues(options) {
      const force = !!(options && options.force);
      const cached = readSession(ISSUES_CACHE_KEY);

      if (!force && cached && Date.now() - cached.ts < CACHE_TTL) {
        return { data: cached.data, fromCache: true };
      }

      const url = 'https://api.github.com/repos/' + GITHUB_CONFIG.owner + '/' + GITHUB_CONFIG.repo +
        '/issues?state=all&per_page=50&sort=created&direction=desc';
      const headers = { 'Accept': 'application/vnd.github+json' };

      let etag = null;
      try { etag = sessionStorage.getItem(ISSUES_ETAG_KEY); } catch (e) {}
      if (etag && cached) headers['If-None-Match'] = etag;

      let res;
      try {
        res = await fetch(url, { headers: headers });
      } catch (e) {
        throw { type: 'network' };
      }

      if (res.status === 304) {
        if (cached) {
          writeSession(ISSUES_CACHE_KEY, { ts: Date.now(), data: cached.data });
          return { data: cached.data, fromCache: true };
        }
        try { sessionStorage.removeItem(ISSUES_ETAG_KEY); } catch (e) {}
        return fetchIssues({ force: true });
      }

      if (!res.ok) throw classifyError(res);

      const data = await res.json();
      const newEtag = res.headers.get('ETag');
      if (newEtag) {
        try { sessionStorage.setItem(ISSUES_ETAG_KEY, newEtag); } catch (e) {}
      }
      writeSession(ISSUES_CACHE_KEY, { ts: Date.now(), data: data });
      return { data: data, fromCache: false };
    }

    async function fetchIssueDetail(number) {
      const res = await fetch(
        'https://api.github.com/repos/' + GITHUB_CONFIG.owner + '/' + GITHUB_CONFIG.repo + '/issues/' + number,
        { headers: { 'Accept': 'application/vnd.github+json' } }
      );
      if (!res.ok) throw classifyError(res);
      return res.json();
    }

    async function fetchComments(number) {
      const key = COMMENTS_CACHE_PREFIX + number;
      const cached = readSession(key);
      if (cached && Date.now() - cached.ts < CACHE_TTL) return cached.data;

      const res = await fetch(
        'https://api.github.com/repos/' + GITHUB_CONFIG.owner + '/' + GITHUB_CONFIG.repo +
        '/issues/' + number + '/comments?per_page=10',
        { headers: { 'Accept': 'application/vnd.github+json' } }
      );
      if (!res.ok) throw classifyError(res);
      const data = await res.json();
      writeSession(key, { ts: Date.now(), data: data });
      return data;
    }

    /* ==================== 加载 Issues ==================== */
    function renderSkeleton(container) {
      container.innerHTML =
        '<div class="skeleton-list" aria-hidden="true">' +
        new Array(4).join('<div class="skeleton-row"></div>') +
        '<div class="skeleton-row"></div>' +
        '</div>';
    }

    function renderIssuesError(err) {
      const container = $('#issuesContainer');
      const ghUrl = 'https://github.com/' + GITHUB_CONFIG.owner + '/' + GITHUB_CONFIG.repo + '/issues';
      const link = '<br><a class="err-link" href="' + ghUrl + '" target="_blank" rel="noopener noreferrer">前往 GitHub Issues 页面 →</a>';

      let html;
      if (err && err.type === 'rate-limit') {
        html = '⏳ GitHub API 触发限流，预计约 <strong>' + err.minutes +
          ' 分钟</strong>后恢复，请稍后再刷新。' + link;
      } else if (err && err.type === 'not-found') {
        html = '❌ 仓库不存在或为私有仓库，无法读取 Issue 列表。' + link;
      } else if (err && err.type === 'network') {
        html = '📡 网络异常，无法连接 GitHub。请检查网络后重新刷新。';
      } else {
        const status = err && err.status ? err.status : '未知';
        html = '❌ 加载失败（状态码 ' + escapeHtml(status) + '）。' + link;
      }

      container.innerHTML = '<div class="issues-error">' + html + '</div>';
    }

    function scheduleRefreshLabel() {
      clearInterval(refreshLabelTimer);
      const paint = function () {
        const btn = $('#refreshBtn');
        if (btn.disabled) return;
        const remain = cacheRemainMs();
        const minutes = remain > 0 ? Math.ceil(remain / 60000) : 0;
        btn.innerHTML = minutes > 0
          ? '<span aria-hidden="true">🔄</span> 刷新 (' + minutes + ')'
          : '<span aria-hidden="true">🔄</span> 刷新';
        if (minutes <= 0) clearInterval(refreshLabelTimer);
      };
      paint();
      refreshLabelTimer = setInterval(paint, 10000);
    }

    async function loadIssues(options) {
      const force = !!(options && options.force);
      const container = $('#issuesContainer');
      const btn = $('#refreshBtn');

      if (!isConfigValid()) {
        container.innerHTML = '<div class="issues-error">⚠️ 尚未配置 GitHub 仓库（owner / repo 为空），暂时无法加载列表。</div>';
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<span aria-hidden="true">⏳</span> 加载中';
      container.setAttribute('aria-busy', 'true');
      renderSkeleton(container);

      try {
        const result = await fetchIssues({ force: force });
        allIssues = result.data.filter(function (item) { return !item.pull_request; });
        updateStats(allIssues);
        renderIssues();
        checkDuplicate();
      } catch (err) {
        console.error('加载 Issues 失败:', err);
        renderIssuesError(err);
        $('#issueCount').textContent = '?';
      } finally {
        btn.disabled = false;
        container.removeAttribute('aria-busy');
        scheduleRefreshLabel();
      }
    }

    /* ==================== 统计 ==================== */
    function updateStats(issues) {
      const total = issues.length;
      const open = issues.filter(function (i) { return i.state === 'open'; }).length;
      const closed = total - open;
      const sevenDaysAgo = new Date(Date.now() - 7 * 24 * 60 * 60 * 1000);
      const week = issues.filter(function (i) { return new Date(i.created_at) >= sevenDaysAgo; }).length;

      $('#statTotal').textContent = total;
      $('#statOpen').textContent = open;
      $('#statClosed').textContent = closed;
      $('#statWeek').textContent = week;
    }

    /* ==================== 渲染列表 ==================== */
    const SORTERS = {
      created: function (a, b) { return new Date(b.created_at) - new Date(a.created_at); },
      comments: function (a, b) {
        return (b.comments || 0) - (a.comments || 0) || (new Date(b.created_at) - new Date(a.created_at));
      },
      updated: function (a, b) { return new Date(b.updated_at) - new Date(a.updated_at); }
    };

    function renderIssues() {
      const container = $('#issuesContainer');
      const countBadge = $('#issueCount');
      const keyword = ($('#searchInput').value || '').trim().toLowerCase();
      const stateFilter = $('#stateFilter').value;
      const sortKey = $('#sortFilter').value;

      let list = allIssues.slice();

      if (stateFilter !== 'all') {
        list = list.filter(function (i) { return i.state === stateFilter; });
      }

      if (keyword) {
        list = list.filter(function (i) {
          return i.title.toLowerCase().indexOf(keyword) !== -1 ||
            (i.body || '').toLowerCase().indexOf(keyword) !== -1;
        });
      }

      list.sort(SORTERS[sortKey] || SORTERS.created);
      countBadge.textContent = list.length;

      if (list.length === 0) {
        if (allIssues.length === 0) {
          container.innerHTML = '<div class="issues-empty">✨ 还没有人提交过 Bug，快来当第一个吧！</div>';
        } else {
          container.innerHTML = '<div class="issues-no-match">🔍 没有匹配的报告，试试换个关键词或筛选条件。</div>';
        }
        return;
      }

      const html = list.map(function (issue) {
        const isOpen = issue.state === 'open';
        const date = new Date(issue.created_at).toLocaleDateString('zh-CN');
        const commentMeta = issue.comments > 0
          ? '<span><span aria-hidden="true">💬</span> ' + issue.comments + '</span>'
          : '';
        const statusText = isOpen ? '未解决' : '已解决';

        return '' +
          '<li class="issue-item ' + (isOpen ? '' : 'closed') + '" role="button" tabindex="0"' +
          ' data-issue="' + issue.number + '"' +
          ' aria-label="#' + issue.number + ' ' + escapeHtml(issue.title) + '（' + statusText + '）">' +
            '<span class="issue-status" aria-hidden="true">' + (isOpen ? '🟢' : '⚪') + '</span>' +
            '<span class="sr-only">' + statusText + '</span>' +
            '<div class="issue-info">' +
              '<div class="issue-title">' + escapeHtml(issue.title) + '</div>' +
              '<div class="issue-meta">' +
                '<span class="issue-number">#' + issue.number + '</span>' +
                '<span><span aria-hidden="true">📅</span> ' + date + '</span>' +
                commentMeta +
              '</div>' +
            '</div>' +
          '</li>';
      }).join('');

      container.innerHTML = '<ul class="issues-list">' + html + '</ul>';
    }

    /* ==================== 弹窗 ==================== */
    function openModal() {
      const modal = $('#issueModal');
      lastFocusedElement = document.activeElement;
      modal.classList.add('active');
      document.body.style.overflow = 'hidden';
      const closeBtn = $('#modalCloseBtn');
      if (closeBtn) closeBtn.focus();
    }

    function closeModal() {
      const modal = $('#issueModal');
      if (!modal.classList.contains('active')) return;
      modal.classList.remove('active');
      document.body.style.overflow = '';
      currentModalNumber = null;
      if (lastFocusedElement && typeof lastFocusedElement.focus === 'function') {
        lastFocusedElement.focus();
      }
      lastFocusedElement = null;
    }

    function trapFocus(e) {
      const modal = $('#issueModal');
      const nodes = modal.querySelectorAll(
        'a[href], button:not([disabled]), input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])'
      );
      const focusables = Array.prototype.filter.call(nodes, function (el) {
        return el.offsetWidth > 0 || el.offsetHeight > 0 || el === document.activeElement;
      });
      if (!focusables.length) return;

      const first = focusables[0];
      const last = focusables[focusables.length - 1];

      if (e.shiftKey && document.activeElement === first) {
        e.preventDefault();
        last.focus();
      } else if (!e.shiftKey && document.activeElement === last) {
        e.preventDefault();
        first.focus();
      }
    }

    function renderModalContent(issue) {
      $('#modalTitle').textContent = issue.title;

      const isOpen = issue.state === 'open';
      const statusText = isOpen ? '未解决' : '已解决';
      const labels = (issue.labels || []).map(function (l) {
        return '<span class="label-chip">' + escapeHtml(l.name) + '</span>';
      }).join('');

      $('#modalMeta').innerHTML =
        '<span>#' + issue.number + '</span>' +
        '<span><span aria-hidden="true">' + (isOpen ? '🟢' : '⚪') + '</span> ' + statusText + '</span>' +
        '<span><span aria-hidden="true">📅</span> ' + new Date(issue.created_at).toLocaleString('zh-CN') + '</span>' +
        '<span><span aria-hidden="true">💬</span> ' + (issue.comments || 0) + ' 条评论</span>' +
        labels;

      $('#modalBody').innerHTML = issue.body
        ? renderMarkdown(issue.body)
        : '<p class="muted">(无描述)</p>';

      const ghLink = $('#modalGithubLink');
      ghLink.href = issue.html_url ||
        ('https://github.com/' + GITHUB_CONFIG.owner + '/' + GITHUB_CONFIG.repo + '/issues/' + issue.number);
    }

    function renderComment(c) {
      const user = c.user || {};
      const avatar = user.avatar_url
        ? '<img class="comment-avatar" src="' + escapeHtml(user.avatar_url) + '" alt="" width="28" height="28" loading="lazy">'
        : '<span class="comment-avatar" aria-hidden="true"></span>';

      return '' +
        '<div class="comment-item">' +
          avatar +
          '<div class="comment-main">' +
            '<div class="comment-head">' +
              '<strong>' + escapeHtml(user.login || '匿名用户') + '</strong>' +
              '<time>' + new Date(c.created_at).toLocaleString('zh-CN') + '</time>' +
            '</div>' +
            '<div class="comment-body">' + renderMarkdown(c.body || '') + '</div>' +
          '</div>' +
        '</div>';
    }

    async function loadComments(number) {
      const wrap = $('#modalComments');
      wrap.innerHTML = '<div class="comments-loading">⏳ 正在加载评论…</div>';

      let list;
      try {
        list = await fetchComments(number);
      } catch (e) {
        if (currentModalNumber !== number) return;
        wrap.innerHTML = '<div class="comments-empty">评论加载失败，可点击下方按钮前往 GitHub 查看。</div>';
        return;
      }

      if (currentModalNumber !== number) return;

      if (!list.length) {
        wrap.innerHTML = '';
        return;
      }

      const shown = list.slice(0, 10);
      wrap.innerHTML =
        '<div class="comments-title"><span aria-hidden="true">💬</span> 评论（' + shown.length + '）</div>' +
        shown.map(renderComment).join('');
    }

    async function openIssueModal(issueNumber) {
      const cached = allIssues.find(function (i) { return i.number === issueNumber; });

      currentModalNumber = issueNumber;

      $('#modalTitle').textContent = '加载中…';
      $('#modalMeta').innerHTML = '';
      $('#modalBody').innerHTML = '<div class="comments-loading">⏳ 正在加载详情…</div>';
      $('#modalComments').innerHTML = '';
      $('#modalGithubLink').href =
        'https://github.com/' + GITHUB_CONFIG.owner + '/' + GITHUB_CONFIG.repo + '/issues/' + issueNumber;

      openModal();

      if (cached) renderModalContent(cached);

      try {
        const data = await fetchIssueDetail(issueNumber);
        if (currentModalNumber === issueNumber) renderModalContent(data);
      } catch (e) {
        if (currentModalNumber === issueNumber && !cached) {
          $('#modalBody').innerHTML =
            '<div class="issues-error">详情加载失败，请点击下方按钮前往 GitHub 查看。</div>';
        }
      }

      if (currentModalNumber === issueNumber) loadComments(issueNumber);
    }

    /* ==================== 重复检测 ==================== */
    function checkDuplicate() {
      const hint = $('#duplicateHint');
      const raw = $('#bugTitle').value.trim().toLowerCase();

      hint.classList.remove('active');
      hint.innerHTML = '';

      if (raw.length < 2 || allIssues.length === 0) return;

      const parts = raw.split(/[\s，,。.、\/\\|;；:：!！?？()（）\[\]【】"“”'‘’]+/)
        .filter(function (w) { return w.length >= 2; });
      const terms = parts.length ? parts : [raw];

      const scored = [];
      allIssues.forEach(function (issue) {
        const title = (issue.title || '').toLowerCase();
        const body = (issue.body || '').toLowerCase();
        let hits = 0;
        terms.forEach(function (t) {
          if (title.indexOf(t) !== -1 || body.indexOf(t) !== -1) hits++;
        });
        const score = hits / terms.length;
        if (score >= 0.5) scored.push({ issue: issue, score: score });
      });

      if (!scored.length) return;

      scored.sort(function (a, b) {
        const aOpen = a.issue.state === 'open' ? 0 : 1;
        const bOpen = b.issue.state === 'open' ? 0 : 1;
        if (aOpen !== bOpen) return aOpen - bOpen;
        return b.issue.number - a.issue.number;
      });

      const matched = scored.slice(0, 3);

      hint.innerHTML =
        '<div>⚠️ <strong>发现 ' + matched.length + ' 条相似报告：</strong></div>' +
        matched.map(function (item) {
          return '<button type="button" class="dup-link" data-issue="' + item.issue.number + '">' +
            '#' + item.issue.number + ' ' + escapeHtml(item.issue.title) + '</button>';
        }).join('') +
        '<div class="dup-tip">如果已有人报告过，建议到对应 Issue 下补充信息。</div>';

      hint.classList.add('active');
    }

    const debouncedDuplicate = debounce(checkDuplicate, 250);

    /* ==================== 表单事件 ==================== */
    function onTitleInput() {
      updateCounter('bugTitle', 'titleCounter', 80);
      debouncedDuplicate();
      saveDraft();
    }

    function onDescInput() {
      updateCounter('bugDescription', 'descCounter', 1000);
      saveDraft();
    }

    function onStepsInput() {
      updateCounter('steps', 'stepsCounter', 600);
      saveDraft();
    }

    /* ==================== 构建 Issue ==================== */
    function buildIssueBody() {
      const nickname = $('#nickname').value.trim();
      const email = $('#email').value.trim() || '(未填写)';
      const bugType = $('#bugType').value;
      const severity = $('#severity').value;
      const bugDesc = $('#bugDescription').value.trim();
      const steps = $('#steps').value.trim() || '(未填写)';

      return [
        '### 🐞 Bug 描述', '', bugDesc, '',
        '### 📋 复现步骤', '', steps, '',
        '### 📊 问题信息', '',
        '- **问题类型**：' + bugType,
        '- **严重程度**：' + severity, '',
        '### 👤 报告者信息', '',
        '- **昵称**：' + nickname,
        '- **联系邮箱**：' + email, '',
        '---',
        '*由微信twu Bug汇报站提交 — ' + new Date().toLocaleString('zh-CN') + '*'
      ].join('\n');
    }

    function buildIssueUrl() {
      const title = $('#bugTitle').value.trim();
      const body = buildIssueBody();
      const base = 'https://github.com/' + GITHUB_CONFIG.owner + '/' + GITHUB_CONFIG.repo + '/issues/new';
      const params = new URLSearchParams({
        title: '[Bug] ' + title,
        body: body,
        labels: GITHUB_CONFIG.labels.join(',')
      });
      return base + '?' + params.toString();
    }

    /* ==================== 提交限流 ==================== */
    function checkRateLimit() {
      try {
        const last = localStorage.getItem(SUBMIT_LIMIT_KEY);
        if (!last) return { ok: true };
        const elapsed = Date.now() - parseInt(last, 10);
        if (elapsed < SUBMIT_COOLDOWN_MS) {
          return { ok: false, remain: Math.ceil((SUBMIT_COOLDOWN_MS - elapsed) / 1000) };
        }
        return { ok: true };
      } catch (e) { return { ok: true }; }
    }

    function showRateLimitToast(remain) {
      const container = $('#messageContainer');
      clearInterval(rateLimitTimer);

      let left = remain;

      container.innerHTML =
        '<div class="toast-message toast-error">' +
          '<span aria-hidden="true">⏳</span>' +
          '<div><strong>提交太频繁啦～</strong><br>请等待 <strong id="rateRemain">' + left + '</strong> 秒后再试。</div>' +
        '</div>';

      container.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

      rateLimitTimer = setInterval(function () {
        left -= 1;
        if (left <= 0) {
          clearInterval(rateLimitTimer);
          container.innerHTML = '';
          return;
        }
        const node = document.getElementById('rateRemain');
        if (node) node.textContent = String(left);
      }, 1000);
    }

    /* ==================== 提交 ==================== */
    function submitToGitHub() {
      const result = validateForm();
      if (!result.ok) return;

      const rl = checkRateLimit();
      if (!rl.ok) {
        showRateLimitToast(rl.remain);
        return;
      }

      if (!isConfigValid()) {
        $('#messageContainer').innerHTML =
          '<div class="toast-message toast-error"><span aria-hidden="true">⚠️</span>' +
          '<div>GitHub 仓库尚未配置，暂时无法提交。</div></div>';
        return;
      }

      const issueUrl = buildIssueUrl();
      try { localStorage.setItem(SUBMIT_LIMIT_KEY, String(Date.now())); } catch (e) {}

      const container = $('#messageContainer');
      const submitBtn = $('#submitBtn');
      const originalText = submitBtn.innerHTML;

      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span aria-hidden="true">⏳</span> 正在跳转…';

      container.innerHTML =
        '<div class="toast-message toast-info">' +
          '<span aria-hidden="true">🔗</span>' +
          '<div><strong>正在打开 GitHub Issues 页面…</strong><br>' +
          '如果浏览器没有自动跳转，请 <a href="' + issueUrl + '" target="_blank" rel="noopener noreferrer" ' +
          'class="toast-link">点击此链接手动打开</a>。<br>' +
          '<span class="toast-tip">在 GitHub 页面上确认后点 "Submit new issue" 发布。</span></div>' +
        '</div>';

      container.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      window.open(issueUrl, '_blank', 'noopener,noreferrer');

      let settled = false;

      function restoreButton() {
        submitBtn.disabled = false;
        submitBtn.innerHTML = originalText;
      }

      function onFocusBack() {
        if (settled) return;
        settled = true;
        window.removeEventListener('focus', onFocusBack);
        setTimeout(function () {
          restoreButton();
          try { localStorage.removeItem(DRAFT_KEY); } catch (e) {}
          loadIssues({ force: true });
        }, 3000);
      }

      window.addEventListener('focus', onFocusBack);

      setTimeout(function () {
        if (settled) return;
        settled = true;
        window.removeEventListener('focus', onFocusBack);
        restoreButton();
      }, 30000);
    }

    /* ==================== 清空 ==================== */
    function clearForm() {
      ['nickname', 'email', 'bugTitle', 'bugDescription', 'steps'].forEach(function (id) {
        const el = document.getElementById(id);
        if (el) {
          el.value = '';
          clearFieldError(el);
        }
      });
      $('#bugType').value = '界面显示';
      $('#severity').value = '一般';

      clearInterval(rateLimitTimer);
      $('#messageContainer').innerHTML = '';

      const hint = $('#duplicateHint');
      hint.classList.remove('active');
      hint.innerHTML = '';

      updateAllCounters();
      try { localStorage.removeItem(DRAFT_KEY); } catch (e) {}
      $('#draftNotice').classList.remove('active');
      $('#nickname').focus();
    }

    /* ==================== 事件绑定 ==================== */
    function bindEvents() {
      $('#bugReportForm').addEventListener('submit', function (e) {
        e.preventDefault();
        submitToGitHub();
      });

      $('#clearBtn').addEventListener('click', clearForm);
      $('#refreshBtn').addEventListener('click', function () { loadIssues({ force: true }); });

      $('#searchInput').addEventListener('input', debounce(renderIssues, 250));

      $('#stateFilter').addEventListener('change', function () {
        $('#searchInput').value = '';
        renderIssues();
      });

      $('#sortFilter').addEventListener('change', renderIssues);

      $('#bugTitle').addEventListener('input', onTitleInput);
      $('#bugDescription').addEventListener('input', onDescInput);
      $('#steps').addEventListener('input', onStepsInput);

      ['nickname', 'email', 'bugTitle', 'bugType', 'severity', 'bugDescription', 'steps'].forEach(function (id) {
        const el = document.getElementById(id);
        if (!el) return;
        const handler = function () {
          clearFieldError(el);
          saveDraft();
        };
        el.addEventListener('input', handler);
        el.addEventListener('change', handler);
      });

      $('#restoreDraftBtn').addEventListener('click', restoreDraft);
      $('#discardDraftBtn').addEventListener('click', discardDraft);

      const issuesContainer = $('#issuesContainer');
      issuesContainer.addEventListener('click', function (e) {
        const item = e.target.closest('.issue-item');
        if (item) openIssueModal(Number(item.dataset.issue));
      });
      issuesContainer.addEventListener('keydown', function (e) {
        if (e.key !== 'Enter' && e.key !== ' ' && e.key !== 'Spacebar') return;
        const item = e.target.closest('.issue-item');
        if (!item) return;
        e.preventDefault();
        openIssueModal(Number(item.dataset.issue));
      });

      $('#duplicateHint').addEventListener('click', function (e) {
        const btn = e.target.closest('.dup-link');
        if (btn) openIssueModal(Number(btn.dataset.issue));
      });

      $('#modalCloseBtn').addEventListener('click', closeModal);
      $('#modalFooterCloseBtn').addEventListener('click', closeModal);
      $('#issueModal').addEventListener('click', function (e) {
        if (e.target.id === 'issueModal') closeModal();
      });

      document.addEventListener('keydown', function (e) {
        const modal = $('#issueModal');
        if (!modal.classList.contains('active')) return;
        if (e.key === 'Escape') {
          closeModal();
          return;
        }
        if (e.key === 'Tab') trapFocus(e);
      });
    }

    /* ==================== 初始化 ==================== */
    function init() {
      bindEvents();
      updateAllCounters();

      const draft = loadDraftFromStorage();
      if (hasDraftContent(draft)) {
        $('#draftNotice').classList.add('active');
      }

      loadIssues();
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  })();
  </script>
</body>
</html>
