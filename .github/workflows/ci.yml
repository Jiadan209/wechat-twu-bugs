name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: 语法 / 结构 / 单元测试
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: JS 语法检查
        run: npm run lint:syntax

      - name: HTML 结构检查
        run: npm run lint:html

      - name: 单元测试
        run: npm test
